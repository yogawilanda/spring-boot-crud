spring:
  application:
    name: demo
  datasource:
    # URL-nya TANPA nama database di akhir
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/database_testing?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    username: "${SPRING_DATASOURCE_USERNAME:root}"
    password: "${SPRING_DATASOURCE_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    org.hibernate: WARN
    org.flywaydb: WARN
    com.zaxxer.hikari: WARN
    org.springframework.boot: WARN
